name: Update and publish Portugal Villa Finder
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: portugal-villa-search
  cancel-in-progress: false
jobs:
  search-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate search code and website
        run: |
          python -m py_compile scripts/collect.py scripts/apply_request.py
          python -m unittest discover -s tests -v
          python scripts/check_site.py
      - name: Search Idealista and Casa SAPO
        env:
          SCRAPPA_API_KEY: ${{ secrets.SCRAPPA_API_KEY }}
          IDEALISTA_RAPIDAPI_KEY: ${{ secrets.IDEALISTA_RAPIDAPI_KEY }}
          IDEALISTA_LOCATION_IDS: ${{ vars.IDEALISTA_LOCATION_IDS }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          MAX_DETAILS_PER_SOURCE: '10'
        run: python scripts/collect.py
      - name: Commit property results and history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add properties.json history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update property feed [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
